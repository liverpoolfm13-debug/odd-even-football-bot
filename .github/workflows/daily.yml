name: Odd Even Football Bot

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: odd-even-football-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Telegram bot
              - name: Check API key
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY OK"
          else
            echo "API_FOOTBALL_KEY MISSING"
            exit 1
          fi
